# docker-compose.yml
services:
  postgres:
    image: postgres:15-alpine  
    container_name: catalogo_db
    environment:
      POSTGRES_USER: admin      
      POSTGRES_PASSWORD: senha123 
      POSTGRES_DB: catalogo_veiculos 
    ports:
      - "5432:5432"  # Porta padrão do PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: